<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roma: Sestertius Quest - Campaign Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the map */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #292524; }
        ::-webkit-scrollbar-thumb { background: #b45309; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d97706; }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top HUD -->
    <header class="bg-stone-950 border-b border-amber-700/50 p-4 flex justify-between items-center shadow-lg z-20">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🏛️</span>
            <div>
                <h1 class="font-bold text-amber-400 text-sm md:text-lg tracking-wide uppercase">Roma: Lingua Invicta</h1>
                <p class="text-xs text-stone-400">Επίπεδο: A1 (Tiro)</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="bg-amber-950/80 border border-amber-600 px-4 py-2 rounded-full flex items-center space-x-2 shadow-inner">
                <span class="text-yellow-400 font-bold text-lg">🪙</span>
                <span id="sestertii" class="text-yellow-300 font-extrabold text-base">0 HS</span>
            </div>
        </div>
    </header>

    <!-- Campaign Map Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 relative" 
          style="background-image: linear-gradient(rgba(28, 25, 23, 0.85), rgba(28, 25, 23, 0.95)), url('https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=1000&auto=format&fit=crop'); background-size: cover; background-attachment: fixed;">
        
        <div class="max-w-3xl mx-auto" id="campaign-container">
            <!-- Content will be injected by JavaScript -->
        </div>
    </main>

    <!-- Lesson Modal -->
    <div id="lesson-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-stone-900 border-2 border-amber-600 rounded-xl max-w-md w-full shadow-2xl overflow-hidden relative">
            <div class="bg-amber-900/50 p-4 border-b border-amber-700 flex justify-between items-start">
                <div>
                    <span id="modal-module" class="text-amber-500 text-xs font-bold uppercase tracking-wider"></span>
                    <h2 id="modal-title" class="text-xl font-bold text-stone-100 mt-1"></h2>
                </div>
                <span id="modal-icon" class="text-3xl"></span>
            </div>
            <div class="p-6">
                <p class="text-amber-200 text-sm mb-2 font-semibold">Στόχος Μαθήματος:</p>
                <p id="modal-desc" class="text-stone-300 text-sm mb-6"></p>
                
                <div class="flex space-x-3">
                    <button onclick="playLesson()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-3 rounded-lg shadow transition">
                        ⚔️ Έναρξη Quest
                    </button>
                    <button onclick="closeModal()" class="bg-stone-700 hover:bg-stone-600 text-stone-200 font-bold py-3 px-4 rounded-lg shadow transition">
                        Άκυρο
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Η δομή των 20 μαθημάτων
        const modules = [
            {
                id: 1,
                title: "Ενότητα I: Τα Θεμέλια της Ρώμης",
                lessons: [
                    { id: 1, title: "Ecce Roma!", desc: "Εισαγωγή, αλφάβητο και λατινική προφορά.", icon: "🗣️", unlocked: true },
                    { id: 2, title: "Η Οικογένεια", desc: "Η Α' Κλίση ουσιαστικών (θηλυκά σε -a, π.χ. puella, Roma).", icon: "👩", unlocked: false },
                    { id: 3, title: "Το Νόμισμα", desc: "Η Β' Κλίση ουσιαστικών (αρσενικά σε -us, π.χ. sestertius).", icon: "🪙", unlocked: false },
                    { id: 4, title: "Sum, Es, Est", desc: "Το ρήμα esse (είμαι) στον Ενεστώτα.", icon: "✨", unlocked: false },
                    { id: 5, title: "Καλοί και Κακοί", desc: "Επίθετα Α'-Β' κλίσης & συμφωνία με το ουσιαστικό.", icon: "⚖️", unlocked: false }
                ]
            },
            {
                id: 2,
                title: "Ενότητα II: Στο Στρατόπεδο",
                lessons: [
                    { id: 6, title: "Ο Λεγεωνάριος", desc: "Η Γ' Κλίση ουσιαστικών (σύμφωνα, π.χ. miles, rex).", icon: "🛡️", unlocked: false },
                    { id: 7, title: "Η Δράση", desc: "Οι 4 βασικές συζυγίες ρημάτων στον Ενεστώτα.", icon: "⚔️", unlocked: false },
                    { id: 8, title: "Ο Στόχος", desc: "Αιτιατική πτώση (Άμεσο Αντικείμενο) & βασική σύνταξη.", icon: "🎯", unlocked: false },
                    { id: 9, title: "Η Ιδιοκτησία", desc: "Γενική πτώση (Κτητική / 'του στρατιώτη').", icon: "📜", unlocked: false },
                    { id: 10, title: "Η Αγορά", desc: "Αριθμητικά & Νομισματικό σύστημα (As, Sestertius, Denarius).", icon: "⚖️", unlocked: false }
                ]
            },
            {
                id: 3,
                title: "Ενότητα III: Δράση και Ιστορία",
                lessons: [
                    { id: 11, title: "Χθες στη Σύγκλητο", desc: "Παρατατικός και Παρελθοντικοί χρόνοι.", icon: "🏛️", unlocked: false },
                    { id: 12, title: "Δώρο στους Θεούς", desc: "Δοτική πτώση (Έμμεσο Αντικείμενο).", icon: "🏺", unlocked: false },
                    { id: 13, title: "Αυτός, Εκείνος", desc: "Δεικτικές Αντωνυμίες (hic, ille, is).", icon: "👉", unlocked: false },
                    { id: 14, title: "Et tu, Brute?", desc: "Κλητική πτώση (Προσφώνηση).", icon: "🗡️", unlocked: false },
                    { id: 15, title: "Διαταγές!", desc: "Προστακτική έγκλιση (Εντολές λεγεωνάριου).", icon: "📢", unlocked: false }
                ]
            },
            {
                id: 4,
                title: "Ενότητα IV: Η Τελική Δοκιμασία",
                lessons: [
                    { id: 16, title: "Σκοπός της Ζωής", desc: "Απλά απαρέμφατα και χρήση τους.", icon: "🔗", unlocked: false },
                    { id: 17, title: "Ο Πράττων", desc: "Εισαγωγή στις μετοχές ενεστώτα.", icon: "🏃", unlocked: false },
                    { id: 18, title: "Όταν και Όπου", desc: "Δευτερεύουσες προτάσεις (τοπικές/χρονικές).", icon: "⏳", unlocked: false },
                    { id: 19, title: "Ο Πόλεμος της Γαλατίας", desc: "Ανάγνωση και μετάφραση μικρών ιστοριών του Καίσαρα.", icon: "📖", unlocked: false },
                    { id: 20, title: "Magister", desc: "Boss Fight: Μετάφραση επιγραφής για την τελική νίκη.", icon: "👑", unlocked: false }
                ]
            }
        ];

        // Rendering the Campaign Map
        const container = document.getElementById('campaign-container');
        
        modules.forEach((mod, modIndex) => {
            // Module Header
            const modHeader = document.createElement('div');
            modHeader.className = "mb-4 mt-8 flex items-center space-x-4";
            modHeader.innerHTML = `
                <div class="h-[2px] flex-1 bg-amber-700/50"></div>
                <h3 class="text-amber-500 font-bold tracking-widest uppercase text-sm">${mod.title}</h3>
                <div class="h-[2px] flex-1 bg-amber-700/50"></div>
            `;
            container.appendChild(modHeader);

            // Lessons List
            const lessonList = document.createElement('div');
            lessonList.className = "space-y-3";

            mod.lessons.forEach(lesson => {
                const isLocked = !lesson.unlocked;
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border-2 flex items-center justify-between transition-all duration-300 ${
                    isLocked 
                    ? "bg-stone-900/50 border-stone-800 opacity-60 cursor-not-allowed" 
                    : "bg-stone-800/90 border-amber-600/50 hover:border-amber-400 hover:bg-stone-700 cursor-pointer shadow-lg transform hover:-translate-y-1"
                }`;
                
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-full ${isLocked ? 'bg-stone-800 text-stone-500' : 'bg-amber-900/50 text-amber-400'} flex items-center justify-center text-xl border ${isLocked ? 'border-stone-700' : 'border-amber-500'}">
                            ${isLocked ? '🔒' : lesson.icon}
                        </div>
                        <div>
                            <h4 class="font-bold ${isLocked ? 'text-stone-500' : 'text-stone-200'}">Μάθημα ${lesson.id}: ${lesson.title}</h4>
                            <p class="text-xs ${isLocked ? 'text-stone-600' : 'text-stone-400'} mt-1 truncate max-w-[200px] md:max-w-md">${lesson.desc}</p>
                        </div>
                    </div>
                    ${!isLocked ? '<span class="text-amber-500 hidden md:block">▶</span>' : ''}
                `;

                if (!isLocked) {
                    card.onclick = () => openModal(mod.title, lesson);
                }
                
                lessonList.appendChild(card);
            });

            container.appendChild(lessonList);
        });

        // Modal Logic
        const modal = document.getElementById('lesson-modal');
        
        function openModal(moduleTitle, lesson) {
            document.getElementById('modal-module').innerText = moduleTitle;
            document.getElementById('modal-title').innerText = `Μάθημα ${lesson.id}: ${lesson.title}`;
            document.getElementById('modal-desc').innerText = lesson.desc;
            document.getElementById('modal-icon').innerText = lesson.icon;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        function playLesson() {
            alert("Εδώ θα φόρτωνε η οθόνη του Visual Novel για αυτό το μάθημα!");
            closeModal();
        }
    </script>
</body>
</html>
